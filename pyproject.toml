[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-core"
version = "0.6.0"
description = "Standalone, reusable billing module for FastAPI applications"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
    "uvicorn>=0.29.0",
]

[tool.setuptools.packages.find]
include = ["billing_core*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]
